<script id="md-source" type="text/plain"># Опросник по пилоту electro-calc: 7 решений

Ответьте коротко: подтвердите предложенный вариант или напишите свой. Там, где решение за инженером или ответственным за цены, достаточно назвать владельца — подробности он подтвердит отдельно.

Порядок вопросов повторяет документ: вход → инженерные правила → стоимость → результат → примеры и роли.

## 1. Вход, веб-форма и импорт

Что увидели: заявки приходят как схема или спецификация; в примерах параметры переносились вручную. Автоматического чтения документов и утверждённого шаблона импорта нет.

Предлагаем для первой версии: веб-калькулятор; параметры из схемы или спецификации переносит человек, автоматическое чтение документов не используется, загрузка Excel/CSV пока не включается (возможна позже только по согласованному шаблону с проверкой).

Подтвердите или измените. Если нужен перечень обязательных полей для старта расчёта, перечислите его. Кто подтверждает шаблон импорта, если он понадобится.

## 2. Инженерный подбор и корпус по вместимости — решает инженер

Что увидели: в примерах есть расхождения по аппаратам (номиналы, полюса, серии), по корпусам и одна противоречивая строка про полюса; правило запаса модулей и округления нигде не записано. Физической компоновки, DIN-раскладки и чертежей в примерах как продуктового требования нет.

Предлагаем: поиск показывает кандидатов, но сам ничего не выбирает; при неизвестной комбинации, спорном корпусе или возможной замене система останавливается и передаёт вопрос инженеру. Корпус — только по вместимости (сумма модулей + запас → типоразмер, «подходит / не подходит / требуется инженер»). Никаких 2D/3D, размещения аппаратов и теплового/кабельного расчёта в пилоте нет.

Подтвердите правило. Назовите инженера, кто подтверждает подбор, запас и округление модулей, замены и каждый спорный случай из примеров.

## 3. Одинаковые позиции и шкафы — решает инженер

Что увидели: один и тот же код в примерах встречается с разными описаниями; количества по одинаковым кодам между спецификацией, расчётом и заказом расходятся; правило объединения нигде не записано.

Предлагаем: похожее описание не делает позиции одинаковыми. Исходные строки сохраняются, объединение выполняется только по согласованному ключу (например, артикул плюс ключевые характеристики) — и для позиций, и для повторяющихся шкафов.

Подтвердите правило или предложите ключ. Назовите, кто утверждает ключ для позиций и для повторяющихся шкафов.

## 4. Цены — решает ответственный за цены

Что увидели: во всех примерах цены введены без источника, даты и поставщика; налог виден только в заголовках; актуальность старых цен не подтверждена. Одна тарифная пометка с датой и отдельные коэффициенты в справочнике — без объяснения смысла.

Предлагаем: у каждой цены видны источник и дата. Старая цена из прошлых расчётов — только пример с пометкой. Без действующей цены позиция не считается автоматически, действует вопрос человеку.

Подтвердите или измените. Назовите владельца: кто ведёт источник цен, какой источник главный, какой срок свежести, что делать без цены, как учитываются налог и округление.

## 5. Работы, расходники и итоговая цена — решает ответственный за цены

Что увидели: работы и расходники везде считаются отдельно от материалов, но по-разному. В двух примерах труд по строке расходников считался как половина цены; в третьем — обычные строки с отдельной ставкой. Прибыль в примерах тоже разная: 25%, 30% (для одной группы из девяти шкафов — уполовинена по неизвестной причине), а в третьем примере в формулах стоит 0,4 при подписи «Прибыль 4%» — это противоречие не разрешено. Правило «работы равны материалам» нигде не доказано.

Предлагаем: работы (ставка × количество) и расходники (отдельная строка или норма) считаются отдельно от материалов; единичные проценты из примеров общим правилом не становятся. Прибыль, наценка, налог и скидки — только по названным правилам: какая база, какая ставка, порядок, исключения, округление. Формула пилота: подытог (материалы + работы + расходники) + прибыль (база × ставка) = цена шкафа.

Подтвердите или измените. Назовите владельца, кто назовёт нормы работ и расходников, базу и ставки прибыли/наценки/налога/скидок, порядок расчёта и округление — включая решение по спору «0,4 против 4%» и по уполовиненной прибыли для тиража.

## 6. Внутренний расчёт и два формата предложения

Что увидели: значения в предложениях численно совпадали с расчётом, но листы предложений не содержат формул — как они собраны, неизвестно. В заказе из одного примера количества по четырём позициям расходятся с расчётом и есть лишнее число без подписи. Правило отбора для заказа не записано.

Предлагаем: предложение клиенту строится из выбранной проверенной версии внутреннего расчёта (сумма строки = количество × цена → суммы шкафов → итог предложения), суммы по строкам и шкафам сверяются с итогом. Внутренние данные в клиентский документ сами не переносятся. Лист заказа выходом пилота автоматически не считается.

Подтвердите или измените. Укажите названия двух нужных форматов, какие поля показывать и скрывать (включая артикулы, цены, работы, налог), кто разрешает выпуск и что делать с расхождениями заказа.

## 7. Примеры для приёмки и ответственные

Что увидели: подготовлены 5 кандидатов (трассировка с конфликтом одинаковости; два шкафа с ценовыми/инженерными вопросами; два шкафа с финансовым вопросом и спором по корпусу) — все пока предварительные. Целевые критерии из карты: полное совпадение состава и отклонение стоимости не более 20%, время — относительно после замера. Срок ответа и замещение ответственных не названы.

Предлагаем: для приёмки берём 3–5 реальных заявок в границах пилота, для каждой есть исходник, ручной образец и итог. Пороги — полное совпадение состава и отклонение стоимости не более 20% (что с чем сравниваем и как считаем налог/округление — по решению). Время и трудозатраты сравниваем с ручной работой без заранее заданного числа.

Подтвердите набор примеров или предложите свой. Назовите: кто утверждает примеры, кто подтверждает технические и ценовые решения, какая версия каждого примера считается финальной, какой срок ответа на вопросы реалистичен и кто подменяет при недоступности.
