<script id="md-source" type="text/plain"># Карта реализации пилота electro-calc

**Основание:** цель карты гипотез «Бизнес-ценность калькулятора», согласованные границы пилота, клиентский черновик ТЗ 0.3.
**Состав карты:** 7 стадий, 17 историй, 17 форм решения.
**Статус:** рабочая карта на согласование. Там, где решение ещё не подтверждено, форма прямо говорит, что требует согласования и чьё решение нужно.
**Форма продукта:** веб-приложение / веб-калькулятор. Никаких 2D/3D-моделей, размещения аппаратов, DIN-раскладки, теплового и кабельного расчёта в пилоте нет.

## Рамка

Цель — быстрее готовить пригодное предварительное предложение для типовых модульных шкафов 0,4 кВ до 125 А без потери инженерной корректности. Карта идёт по порядку работы: заявка → данные → технический состав → стоимость → сверка → документы → приёмка.

Карта не задаёт архитектуру и не утверждает спорные правила. Неизвестное остаётся открытым вопросом, а не скрытым правилом. Порядок групп везде один: вход → инженерные правила → стоимость → результат → примеры и роли. Каждая открытая форма связана с одним допущением ТЗ и одним вопросом опросника.

Расчётная модель пилота (сквозная, детали — в ТЗ §7): сумма строки = количество × цена; сумма работ строки = ставка × количество; материалы и работы шкафа — суммы строк; расходники — отдельная статья; подытог + прибыль (база × ставка по решению) = цена шкафа; сумма шкафа = цена × количество шкафов; итог предложения = сумма шкафов. Проценты из старых примеров правилом не являются.

## Стадии и истории

Каждая история проверяется свёрткой: носитель, когда наступает ситуация, действует способом, чтобы достичь цели.

### 1. Разобрать заявку и установить границы

**1.1 Получить заявку и определить пригодность для пилота**

- Цель: быстро подготовить пригодное предварительное предложение для типового шкафа без потери корректности.
- Носитель: Алексей.
- Ситуация: поступила заявка на предварительный расчёт шкафа.
- Способ действия: проверяет тип, напряжение, ток и наличие логики; типовую заявку принимает, неподходящую передаёт на ручную проработку.
- Объекты: заявка, схема или спецификация → решение о пригодности и карточка расчёта.
- Форма: карточка расчёта с отметкой «типовой / вне пилота» и причиной. Границы подтверждены: веб-калькулятор для модульного шкафа 0,4 кВ до 125 А, типовая схема без автоматики и логики.
- Смотреть: ТЗ §2–4, вопрос 1.

### 2. Подготовить и найти исходные данные

**2.1 Перенести параметры из схемы или спецификации**

- Цель: получить пригодные исходные данные без ошибочного чтения документа.
- Носитель: Алексей.
- Ситуация: заявка в границах пилота представлена схемой или спецификацией.
- Способ действия: вручную переносит вводной аппарат, группы, производителя и серию; записывает вопросы и допущения.
- Объекты: схема или спецификация, ответы и допущения → параметры заявки.
- Форма: таблица ручного ввода с полями вводного аппарата, групп, производителя и серии, полем источника и пометкой вопроса. Автоматическое чтение документов в пилот не входит.
- Смотреть: ТЗ §5, вопрос 1.

**2.2 Загрузить таблицу спецификации — вариант до подтверждения**

- Цель: сократить повторный ручной ввод.
- Носитель: Алексей.
- Ситуация: параметры уже есть в таблице Excel или CSV согласованного вида.
- Способ действия: передаёт таблицу в расчёт вместо ручного переноса, проверяет строки до принятия.
- Объекты: файл таблицы → проверенные строки параметров.
- Форма: загрузка файла только для согласованного шаблона с проверкой колонок. Требует согласования: включать ли загрузку в пилот. До ответа действует ручной ввод.
- Смотреть: ТЗ §5, вопрос 1.

**2.3 Найти позицию в каталоге**

- Цель: сократить ручной поиск и риск ошибки переноса.
- Носитель: Алексей.
- Ситуация: при переносе или проверке нужно найти изделие.
- Способ действия: ищет по артикулу и известным характеристикам, сверяет совпадение до добавления; совпадение показывает как кандидата, а не как готовое решение.
- Объекты: артикул, характеристики, производитель и серия → подходящие кандидаты.
- Форма: строка поиска с фильтрами по производителю, серии и ключевым характеристикам, список кандидатов с видимым артикулом и ценой. Точный набор фильтров — требует согласования.
- Смотреть: ТЗ §5–6, вопросы 1–2.

### 3. Сформировать технический состав

**3.1 Подобрать аппарат по параметрам — требует согласования**

- Цель: собрать технически верный состав.
- Носитель: Алексей с помощью расчётного инструмента.
- Ситуация: параметры групп известны.
- Способ действия: сопоставляет назначение, номинал, полюса, производителя и серию; спорное не решает молча, а передаёт инженеру.
- Объекты: параметры групп и каталог → подходящие аппараты и список несоответствий.
- Форма: подбор с показом совпавших и несовпавших характеристик, спорные строки подсвечены и ждут инженера. Поиск кандидатов не означает автоматический инженерный выбор. Точный порядок характеристик — требует согласования с инженером.
- Смотреть: ТЗ §6, вопрос 2.

**3.2 Определить корпус по вместимости — требует согласования**

- Цель: собрать применимый модульный шкаф.
- Носитель: Алексей с помощью расчётного инструмента.
- Ситуация: аппараты подобраны.
- Способ действия: считает сумму модулей, добавляет согласованный запас, предлагает типоразмер с достаточной вместимостью; спорный случай передаёт инженеру.
- Объекты: состав аппаратов и характеристики корпусов → подходящий корпус и проверка вместимости.
- Форма: расчёт «занято модулей → плюс запас → кандидат корпуса» с пометкой «подходит / не подходит / требуется инженер»; при споре показываются оба варианта. Нормы запаса и округления — требует согласования с инженером. Размещение аппаратов внутри корпуса и чертёж в пилот не входят.
- Смотреть: ТЗ §6–7, вопрос 2.

**3.3 Сопоставить позицию и возможную замену — требует согласования**

- Цель: сохранить смысл позиции и не допустить молчаливой замены.
- Носитель: Алексей с инженером.
- Ситуация: артикул отсутствует или кандидат отличается от исходного.
- Способ действия: показывает исходную и предложенную позиции рядом; применяет замену только после явного подтверждения инженера.
- Объекты: исходная строка и кандидаты → подтверждённая позиция или зафиксированное противоречие.
- Форма: карточка сравнения «было → предлагается» с полем решения инженера. Правила замен — требует согласования.
- Смотреть: ТЗ §6, вопрос 2.

**3.4 Остановить расчёт при противоречии или нехватке данных**

- Цель: не выдавать неподтверждённое решение за готовый результат.
- Носитель: расчётный инструмент и Алексей.
- Ситуация: не хватает данных, позиция невозможна или источники противоречат друг другу (включая цену, прибыль и корпус).
- Способ действия: сохраняет основание, задаёт вопрос или передаёт случай инженеру; замену и ставку сам не подставляет.
- Объекты: неполная или противоречивая заявка → вопрос, передача человеку, отметка «не готов».
- Форма: строка расчёта со статусом «не готов», видимой причиной и кнопкой передачи инженеру. Требует согласования: точный перечень сочетаний — за инженером.
- Смотреть: ТЗ §6, вопросы 2–3.

**3.5 Зафиксировать решение владельца и пересчитать на новой версии**

- Цель: продолжить работу после решения без потери истории.
- Носитель: Алексей.
- Ситуация: владелец передал решение по ранее остановленному расчёту.
- Способ действия: записывает решение с основанием, создаёт новую версию расчёта и запускает пересчёт, предыдущую версию сохраняет.
- Объекты: вопрос и решение владельца → новая версия расчёта с сохранённой историей.
- Форма: карточка решения с автором, датой и основанием плюс новая версия расчёта; предыдущая версия доступна для сверки. Требует согласования: состав обязательных полей истории версий.
- Смотреть: ТЗ §2, шаг 7; §6, вопросы 2–3.

### 4. Определить стоимость

**4.1 Подтвердить цену с источником и датой — требует согласования**

- Цель: получить проверяемую основу стоимости.
- Носитель: держатель базы цен и Алексей.
- Ситуация: для позиции есть несколько цен, цена старая или отсутствует.
- Способ действия: сохраняет источник и дату; применяет только согласованный порядок источников или передаёт вопрос человеку.
- Объекты: позиция и источники цены → цена с видимым источником и отметкой свежести.
- Форма: цена с подписью источника и даты, старая цена помечена как пример; сумма строки считается как количество × цена. Порядок источников, срок свежести и действия без цены — требует согласования.
- Смотреть: ТЗ §7, вопрос 4.

**4.2 Рассчитать работы и расходные материалы — требует согласования**

- Цель: отразить затраты на сборку отдельно от материалов.
- Носитель: расчётный инструмент.
- Ситуация: состав шкафа подтверждён для расчёта.
- Способ действия: считает сборку отдельно от материалов по названным расценкам (ставка × количество), расходники — отдельной строкой или по названной норме.
- Объекты: состав и сложность → стоимость работ и расходников.
- Форма: две отдельные строки «работы» и «расходники» с видимой нормой; суммы строк — ставка × количество, суммы шкафа — суммы строк. Конкретные нормы — требует согласования; правило «половина цены» и проценты из примеров общим правилом не являются.
- Смотреть: ТЗ §7, вопрос 5.

**4.3 Применить прибыль, налог и скидки — требует согласования**

- Цель: подготовить согласованную предварительную цену.
- Носитель: ответственный за цены и расчётный инструмент.
- Ситуация: стоимость позиций и работ готова к итогу.
- Способ действия: применяет только названные правила прибыли, наценки, налога и скидок; показывает состав итога.
- Объекты: материалы, работы, расходники и коммерческие правила → итоговые суммы.
- Форма: расшифровка «подытог + прибыль (база × ставка) = цена шкафа; цена × количество = сумма» с отдельными строками базы, надбавки, налога и скидки. Ставки, база, порядок и исключения — требует согласования; ставки из старых примеров (включая спорные) без решения не применяются.
- Смотреть: ТЗ §7, вопрос 5.

### 5. Сверить и собрать расчёт

**5.1 Свести подтверждённые части в итог — требует согласования**

- Цель: получить проверяемый итог.
- Носитель: расчётный инструмент под контролем Алексея.
- Ситуация: состав и стоимостные части доступны.
- Способ действия: считает итог только по подтверждённым входам (материалы + работы + расходники + прибыль/налоги), показывает пропуски и происхождение значений.
- Объекты: состав, цены, работы, расходники и коммерческие правила → строки и итог.
- Форма: сводная таблица строк с итогом и пометками происхождения каждого значения; итог предложения — сумма шкафов. Точные ставки и округление — требует согласования.
- Смотреть: ТЗ §7–8, вопрос 6.

**5.2 Сверить строки и объединить шкафы — требует согласования**

- Цель: сохранить соответствие состава каждого шкафа итогам предложения.
- Носитель: расчётный инструмент под контролем Алексея.
- Ситуация: в расчёте есть повторяющиеся или несколько разных шкафов.
- Способ действия: сверяет суммы строк с итогами по шкафам, объединяет только по утверждённому ключу.
- Объекты: строки, признак одинаковости и количества → сверенные позиции и сводные итоги.
- Форма: сверка «строки → шкаф → итог» с показом количеств и цены × количества. Ключ одинаковости — требует согласования.
- Смотреть: ТЗ §8, вопросы 3 и 6.

### 6. Подготовить документы

**6.1 Подготовить внутреннюю ведомость — требует согласования**

- Цель: проверить и обосновать стоимость до ответа клиенту.
- Носитель: Алексей.
- Ситуация: нужно проверить состав и объяснить цену.
- Способ действия: просматривает позиции, суммы, источники, допущения и вопросы в одном документе.
- Объекты: заявка, состав и части расчёта → внутренняя ведомость и итог.
- Форма: ведомость с составом, суммами, источниками цен и списком допущений. Точный перечень полей — требует согласования; внутренние цены, прибыль и служебные пометки клиенту не уходят.
- Смотреть: ТЗ §8, вопрос 6.

**6.2 Сформировать предложение в одном из двух форматов — требует согласования**

- Цель: передать клиенту пригодное предварительное предложение.
- Носитель: Алексей.
- Ситуация: внутренний расчёт проверен и пригоден для ответа.
- Способ действия: выбирает один из двух форматов, включает только разрешённые сведения.
- Объекты: внутренняя ведомость и согласованные поля → предложение выбранного формата.
- Форма: документ выбранного формата, построенный из проверенной версии расчёта, с видимыми допущениями. Шаблоны и поля — требует согласования. Выпуск при открытом важном вопросе удерживается.
- Смотреть: ТЗ §8, вопрос 6.

### 7. Проверить и принять результат

**7.1 Сверить результат с примерами — требует согласования**

- Цель: подтвердить пользу и границы пилота.
- Носитель: Алексей при участии заказчика и инженера.
- Ситуация: подготовлены согласованные примеры и результаты расчёта.
- Способ действия: сравнивает состав, стоимость и время; записывает расхождения как дефект или новый объём.
- Объекты: примеры, результаты и журнал замечаний → протокол приёмки.
- Форма: таблица сверки по каждому примеру с итогом «принят / требует доработки». Набор примеров (3–5), способ сравнения сумм (полное совпадение состава, отклонение стоимости не более 20%, относительное время) и учёт налога и округления — требует согласования.
- Смотреть: ТЗ §9–10, вопрос 7.

## Соответствие задачам карты гипотез

| Задача карты гипотез | Раздел ТЗ | Истории |
|---|---|---|
| №1 — пользователь и базовый процесс | §2, §5 | 1.1, 2.1 |
| №2 — примеры для приёмки | §9 | 7.1 |
| №3 — критерии приёмки | §9 | 7.1 |
| №4 — доступность эксперта и срок ответа | §10 | 7.1, роли |
| №5 — границы пилота 0,4 кВ до 125 А | §3–4 | 1.1 |
| №8 — загрузка Excel/CSV | §5 | 2.2 |
| №9 — единый порядок расчёта | §2, §5–8 | 2.1–2.3, 3.1–3.5, 4.1–4.3, 5.1–5.2, 6.1–6.2 |
| №10 — разбор типового расчёта | §2, §5–6 | 2.1 |
| №11 — черновик ТЗ и открытые решения | §1–11 | вся карта |

Дополнительно: история 2.3 опирается на желание пользователя иметь параметрический каталог с передачей спорных случаев человеку. Это желание, а не задача карты гипотез; в прошлой версии оно было ошибочно подписано как задача.

## Проверка по предметным событиям

События 1–6 (заявка получена, тип документа, границы, ручной перенос, нехватка параметров, вопрос записан) — истории 1.1, 2.1, 2.2. События 7–11 (производитель и серия, кандидаты, противоречие, модули, корпус) — истории 2.3, 3.1–3.3. События 12–16 (цена с источником, материалы, работы, расходники, финансовые правила) — истории 4.1–4.3. События 17–20 (стоимость шкафа, сводка шкафов, внутренний расчёт, предложение) — истории 5.1–5.2, 6.1–6.2. События 21–23 (передача человеку, решение записано, пересчёт после уточнения) — истории 3.4–3.5. Нового поведения без опоры на события или допущения в карте нет. Спорные ставки и размеры остаются открытыми. Компоновка, DIN-раскладка и 2D/3D намеренно отсутствуют как вне пилота.

## Следующий шаг

Получить ответы на 7 вопросов опросника и письменные решения инженера и ответственного за цены, затем обновить только затронутые формы и перевести соответствующие пункты ТЗ в подтверждённые.

Точный пакет для живой карты (применяется человеком с доступом, т.к. запись через шлюз в этой среде недоступна): обновить тексты историй 3.2 (вместимость вместо размещения), 4.1–4.3 и 5.1 (расчётные механики выше) без смены статусов; убедиться, что live-состав остаётся 7 стадий / 17 историй / 17 форм; затем прочитать карту обратно и проверить отсутствие внутренних кодов.
