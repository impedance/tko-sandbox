<script id="md-source" type="text/plain"># ТЗ: пилот electro-calc

**Статус:** на обсуждение и подтверждение заказчиком, инженером и ответственным за цены
**Версия:** 0.3 · 1 октября 2026 г. (обновлено по Issue #36: добавлена расчётная модель, честные инженерные границы, веб-форма пилота)

## 1. Что делает система

Система — это **веб-приложение / веб-калькулятор** для подготовки предварительного расчёта и коммерческого предложения для типовых модульных распределительных шкафов 0,4 кВ до 125 А.

Она уменьшает повторный ручной поиск позиций и перенос данных, показывает состав, стоимость и принятые допущения до ответа клиенту. Окончательное инженерное и ценовое решение всегда остаётся за человеком: спорные случаи система показывает явно и не решает молча.

Результат пилота — проверенный внутренний расчёт и коммерческое предложение в одном из двух согласованных форматов.

Это НЕ система проектирования и НЕ конструктор шкафа: никакой 2D/3D-модели, размещения аппаратов, раскладки по DIN-рейкам, теплового расчёта, кабельных трасс и шинных решений в пилоте нет (см. §4 и §6).

## 2. Как пользуется системой

1. Алексей получает заявку от клиента в виде схемы или спецификации.
2. Он проверяет, подходит ли запрос под пилот, и вручную переносит параметры из документа. Система сама документы не читает.
3. Он находит нужные позиции, собирает технический состав, подбирает корпус по вместимости (сколько модулей занято + согласованный запас). Если данных не хватает или позиции противоречат друг другу, система показывает причину и передаёт вопрос человеку.
4. Для собранного состава подготавливаются цены, стоимость сборки и расходных материалов. Какие источники и правила действуют, подтверждается отдельно.
5. Алексей проверяет внутренний расчёт: состав, суммы по строкам и шкафам, источники цен, допущения и вопросы.
6. Из проверенного расчёта формируется предложение клиенту в выбранном формате. Пока порядок выпуска не согласован, результат остаётся проектом. Неполный или спорный расчёт готовым не выдаётся.
7. Когда инженер или ответственный за цены передаёт решение, Алексей фиксирует его (кто, когда, на каком основании) и при необходимости запускает пересчёт. Предыдущая версия и основание решения сохраняются для сверки.

## 3. Что входит в пилот

- Предварительный расчёт типового модульного шкафа 0,4 кВ до 125 А, без автоматики и управляющей логики.
- Веб-калькулятор: ручной ввод параметров заявки из схемы или спецификации.
- Поиск позиций в каталоге по артикулу и характеристикам (подбор кандидатов, не автоматический инженерный выбор).
- Подбор аппаратов по параметрам и выбор корпуса **по вместимости** (сумма модулей + согласованный запас).
- Цены, стоимость сборочных работ и расходных материалов как отдельные части расчёта.
- Внутренний расчёт для проверки.
- Два формата предложения клиенту.
- Несколько шкафов в одном предложении, включая повторяющиеся.

Конкретные правила подбора, нормы, ставки и поля документов подтверждаются на примерах из раздела 9. До подтверждения они считаются открытыми решениями.

## 4. Что явно не входит в пилот

- Шкафы ВРУ, оборудование 6–10 кВ, немодульные шкафы.
- Схемы с автоматическим вводом резерва и логикой управления освещением, насосами, двигателями.
- Автоматическое чтение схем и документов.
- Автоматическая замена позиций без подтверждения инженера.
- Производственный заказ или точный инженерный расчёт вместо предварительного предложения.
- **Физическое проектирование шкафа:** 2D/3D-модель, визуальное размещение аппаратов внутри корпуса, раскладка по DIN-рейкам, автоматическая компоновка, тепловой расчёт, трассы кабелей, шинные решения, пространственные зазоры, производственный layout. Максимум пилота по корпусу — посчитать требуемую модульную ёмкость, применить согласованный запас и предложить подходящий типоразмер с пометкой «подходит / не подходит / требуется инженер».

Указанные категории можно смотреть как контекст, но они не задают правила пилота и не используются для приёмки. Отдельные программы для проектирования (desktop/CAD/3D) — только по отдельному решению заказчика.

## 5. Вход и данные

Для расчёта нужны сведения из заявки: вводной аппарат, отходящие группы, производитель и серия — в пределах того, что есть в исходнике. Точный обязательный перечень полей подтверждается на примерах.

Предлагаемое допущение: в первой версии параметры переносит человек. Загрузка таблицы Excel или CSV — открытое решение (вопрос 1 опросника). Пока ответа нет, действует ручной ввод. Загрузка возможна только по согласованному шаблону с проверкой колонок.

Если данные неполные или противоречивые, система показывает статус и причину, просит уточнение или передаёт расчёт человеку. Неподтверждённая позиция не подменяется молча.

Для каждого расчёта предлагается сохранять исходные значения, версию справочника и основание ручного решения. Точный состав этой истории подтверждается отдельно.

## 6. Инженерные правила

Подбор аппаратов, выбор корпуса, допустимые замены и признание двух позиций одинаковыми требуют подтверждения инженера на примерах.

Предлагаемые допущения до ответа:

- Поиск позиций по артикулу и характеристикам показывает **кандидатов**, но не выбирает за инженера. Неизвестная комбинация или замена не выбирается автоматически. Система останавливает позицию и передаёт её инженеру (вопрос 2 опросника).
- Корпус подбирается только по вместимости: сумма модулей выбранных аппаратов + согласованный запас и правило округления → подходящий типоразмер. Сами нормы запаса и округления подтверждает инженер. Спорный случай (например, в примерах расходились размеры корпуса) — показываются оба варианта, размер без инженера не выбирается.
- Одно похожее описание не делает позиции одинаковыми. Исходные строки сохраняются, объединение выполняется только по согласованному ключу (например, артикул плюс ключевые характеристики) (вопрос 3 опросника).

В имеющихся примерах есть расхождения по параметрам аппаратов, размерам корпуса и трактовке отдельных полей. Они остаются открытыми и не превращаются в общие правила этим документом. Кто подтверждает каждый спорный случай, фиксируется в опроснике.

## 7. Расчётная модель и алгоритмы пилота

Этот раздел — главное добавление версии 0.3. Он показывает, **как именно** пилот считает, что уже доказано примерами, а что остаётся открытым решением. Никакой процент из старых файлов не становится правилом без подтверждения.

### 7.1 Порядок расчёта (всегда одинаковый)

```
для каждой позиции:
  сумма_материалов_строки = количество × цена
  сумма_работ_строки = ставка_работы × количество
для каждого шкафа:
  материалы_шкафа = сумма всех сумм_материалов_строк
  работы_шкафа = сумма всех сумм_работ_строк
  расходники_шкафа = отдельная статья (строка или норма — по решению)
  подытог_шкафа = материалы_шкафа + работы_шкафа (+ расходники, если они не внутри строк)
  прибыль_шкафа = база × ставка (оба — по решению, см. 7.3)
  цена_шкафа = подытог_шкафа + прибыль_шкафа
  сумма_шкафа = цена_шкафа × количество_шкафов
для предложения:
  итог = сумма всех сумм_шкафов
```

Расходники, работы и материалы всегда считаются и показываются раздельно. Старое упрощение «работы равны стоимости материалов» не применяется.

### 7.2 Что мы увидели в примерах (evidence, не правила)

- Во всех примерах сумма строки — это количество × цена, сумма шкафа — сумма строк, итог предложения — сумма шкафов. Это устойчивая механика.
- Описание и цена в одном примере подтягивались поиском по коду из справочника; в двух других цены и ставки работ были введены вручную по строкам.
- В двух примерах труд по строке «расходные материалы» считался как половина цены расходников. В третьем примере расходники — обычные строки с отдельной ставкой. Единого правила «расходники = половина» нет.
- Прибыль в примерах считалась от материалов, но ставка была разной: в одном примере 25%, в другом 30% (с одним исключением — для группы из девяти одинаковых шкафов прибыль была уполовинена по неизвестной причине), в третьем в формулах стоит 0,4 при подписи «Прибыль 4%» — это противоречие не разрешено.
- В одном справочнике есть пометка тарифа с датой и отдельные формулы с коэффициентом, смысл которых не подтверждён.
- Значения в предложениях клиенту численно совпадали с расчётом, но сами листы предложений не содержат формул — как они были собраны и отправлялись ли, неизвестно.

### 7.3 Параметризованные правила (предложение на подтверждение)

Вместо фиксированных процентов предлагаются настраиваемые правила:

- **Цена:** значение + источник + дата/версия + валюта и налог. Старая цена из прошлых расчётов — только пример с пометкой. Без действующей цены позиция не считается автоматически (вопрос 4 опросника).
- **Работа:** ставка × количество по названной расценке. Расходники — отдельной строкой или по названной норме (вопрос 5 опросника).
- **Прибыль/наценка/налог/скидки:** база × ставка по правилам ответственного за цены: какая база (материалы или другое), какая ставка, порядок применения, округление, исключения. Наблюдаемые 25% / 30% / 0,4 / половинные коэффициенты — только примеры из файлов, а не ставки пилота (вопрос 5 опросника).
- **Точность:** какие суммы сравниваются, как учитываются налог и округление — подтверждает ответственный за цены (вопросы 5–6 опросника).

Пока ответа нет, система считает только по подтверждённым входам, показывает происхождение каждого значения и удерживает выпуск при открытом важном вопросе.

### 7.4 Корпус по вместимости (кандидатная модель)

```
занято_модулей = сумма модульных ширин выбранных аппаратов
требуется_модулей = занято_модулей + запас (по правилу инженера)
кандидат_корпуса = наименьший типоразмер с вместимостью ≥ требуется_модулей
результат = «подходит» / «не подходит» / «требуется инженер»
```

Норму запаса и правило округления называет инженер. Спорный размер без инженера не выбирается. Физическая раскладка внутри корпуса в пилот не входит.

## 8. Результат и предложение клиенту

Предусматриваются:

1. **Внутренний расчёт** для проверки: состав, материалы, работы, расходники, коммерческие параметры и итог. Точный перечень видимых и служебных полей согласуется отдельно. Внутренние данные (закупочные цены, прибыль, формулы, служебные пометки, нерешённые вопросы) в клиентский документ автоматически не переносятся.
2. **Два формата предложения клиенту.** Обязательные поля, названия, показ допущений и правила сумм согласуется отдельно. Внутренние данные в клиентский документ автоматически не переносятся.
3. **Несколько шкафов в одном предложении.** Как показывать количества и когда повтор считается тем же шкафом, согласуется отдельно (только по утверждённому ключу, не по похожему названию).

Предлагаемое допущение: клиентский документ строится из выбранной проверенной версии внутреннего расчёта, суммы по строкам и шкафам сверяются с итогом (вопрос 6 опросника). Правила точности и округления подтверждаются с ответственным за цены. Лист заказа из примеров не объявляется выходом пилота автоматически — его назначение и правило отбора подтверждает владелец.

## 9. Эталоны и приёмка

Приёмка проводится только на примерах, которые заказчик и инженер заранее признали подходящими: 3–5 реальных заявок в границах пилота. Для каждого примера нужны исходник, вопросы и ответы, ручной образец, финальный состав, цены, работы, расходники и итог (вопрос 7 опросника). Подготовлены 5 кандидатов из разведки (трассировка с конфликтом одинаковости; два лисичанских шкафа — один с ценовым вопросом, один с неподтверждёнными заменами; два элистийских шкафа — один с финансовым вопросом, один со спором по корпусу); все пока предварительные, ни один не признан готовым.

Проект критериев до согласования примеров:

1. Примеры подготовлены и признаны подходящими для пилота.
2. Технический состав в каждом примере полностью совпадает с согласованным ручным образцом. Допуск по цене инженерную ошибку не покрывает.
3. Отклонение стоимости от согласованного ручного образца — не более 20%. Какие суммы сравниваются и как учитываются налог и округление, подтверждает ответственный за цены.
4. Время от заявки до готового предложения и трудозатраты инженера измеряются и сравниваются с ручной работой. Целевой срок числом пока не установлен (сначала измеряется baseline, затем — относительное улучшение).
5. Неполный или спорный результат явно показывает вопрос и не выдаётся как готовый.
6. Внутренний расчёт и клиентский документ содержат только согласованные поля; повторяющиеся и несколько шкафов показаны по согласованным правилам. Обе формы арифметически сходятся с внутренним расчётом.

Минимальные сценарии проверки:

| Ситуация | Что проверяется |
|---|---|
| Типовая заявка с готовой спецификацией | Параметры перенесены, состав и итог сверяются с ручным образцом, предложение формируется в выбранном формате |
| В исходниках расходятся параметр или обозначение | Противоречие показано, система сама значение не выбирает, решение фиксирует человек |
| Неоднозначная позиция или возможная замена | Исходная и предложенная позиции различимы, замена применяется только после подтверждения инженера |
| Нет действующей цены | Отсутствующая или старая цена не выдаётся за действующую, действует согласованный порядок или вопрос человеку |
| Несколько шкафов или повтор одной модели | Итоги по шкафам сверяются, объединение выполняется по согласованному ключу |
| Спор по корпусу или размеру | Показаны оба варианта, размер без инженера не выбирается |
| Исключение из правила (например, особая прибыль для тиража) | Исключение видно с основанием и автором решения, без основания не применяется |

Конкретные примеры и ожидаемые значения утверждают владельцы. Состав сценариев выше — предложение к подтверждению.

## 10. Роли и решения

- Оператор первого этапа — Алексей: готовит расчёт и предложение.
- Инженер — подтверждает подбор, корпус (вместимость, запас), замены, ключ одинаковости и спорные технические случаи.
- Ответственный за цены — подтверждает источники, свежесть, нормы работ и расходников, прибыль, наценку, налог, скидки и правила сверки сумм.
- Заказчик — подтверждает границы, веб-форму, форматы документов, набор примеров и порядок выпуска.

Срок ответа на вопросы и порядок действий при недоступности ответственного — открытое решение (вопрос 7 опросника). До ответа результат остаётся проектом.

## 11. Замечание — это дефект или новый объём

- **Дефект:** согласованное правило, поле или сценарий работает иначе; расчёт расходится с согласованным образцом сверх допуска; спорный случай выдан за готовый результат.
- **Новый объём:** новый формат, класс шкафов, импорт или чтение документов, правило расчёта, источник или поведение, не согласованные в этой версии. Сюда же относятся: 2D/3D-компоновка, DIN-раскладка, тепловой/кабельный/шинный расчёт, desktop/CAD-форма — только отдельными решениями.

Замечание записывается с примером, входом, ожидаемым и фактическим результатом и источником правила. Спор о самом правиле сначала решает ответственный владелец.
